<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Sudayku">
  <!-- Zelfde beeld als het app-icoon (Design/appicon_dagcel.py): koraalverloop,
       acht crème vakjes en de zon op de plek van het middelste vakje.
       Maten in icoonpunten: marge 124, cel 224, gat 52 -> 3*224 + 2*52 + 2*124 = 1024. -->
  <defs>
    <!-- Diagonaal verloop: linksboven naar oranje, rechtsonder een vleug framboos -->
    <linearGradient id="vlak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7e5c"/>
      <stop offset="1" stop-color="#f75a6e"/>
    </linearGradient>

    <!-- Licht dat tussen de vakjes door lekt; ligt onder de vakjes, zodat het
         alleen in de goten zichtbaar is en het crème schoon blijft. -->
    <radialGradient id="gloed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb526" stop-opacity="0.49"/>
      <stop offset="0.8" stop-color="#ffb526" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffb526" stop-opacity="0"/>
    </radialGradient>

    <!-- Hooglicht linksboven, zoals de zon in de app zelf -->
    <radialGradient id="zon" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffda8a"/>
      <stop offset="1" stop-color="#ffb526"/>
    </radialGradient>
  </defs>

  <!-- rx = 22,5% van de zijde: dezelfde verhouding als een iOS-app-icoon -->
  <rect width="1024" height="1024" rx="230" fill="url(#vlak)"/>
  <circle cx="512" cy="512" r="268" fill="url(#gloed)"/>

  <!-- Acht vakjes; het middelste blijft leeg voor de zon. -->
  <g fill="#fff5eb">
    <rect x="124" y="124" width="224" height="224" rx="60"/>
    <rect x="400" y="124" width="224" height="224" rx="60"/>
    <rect x="676" y="124" width="224" height="224" rx="60"/>
    <rect x="124" y="400" width="224" height="224" rx="60"/>
    <rect x="676" y="400" width="224" height="224" rx="60"/>
    <rect x="124" y="676" width="224" height="224" rx="60"/>
    <rect x="400" y="676" width="224" height="224" rx="60"/>
    <rect x="676" y="676" width="224" height="224" rx="60"/>
  </g>

  <!-- De zon loopt iets de goot in: groter dan zijn vakje. -->
  <circle cx="512" cy="512" r="126" fill="url(#zon)"/>
</svg>
